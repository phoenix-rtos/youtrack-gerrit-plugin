<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- YouTrack gradient (pink/magenta) -->
    <linearGradient id="ytGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB43FF"/>
      <stop offset="100%" stop-color="#FB406D"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square with YouTrack gradient (like YT logo) -->
  <rect x="2" y="2" width="60" height="60" rx="8" ry="8" fill="url(#ytGradient)"/>
  
  <!-- Gerrit-style overlapping squares -->
  <!-- Back square (pinkish - reject/needs work) -->
  <rect x="8" y="8" width="32" height="32" rx="4" ry="4" fill="#ffcccc" opacity="0.9"/>
  
  <!-- Front square (greenish - approved) -->
  <rect x="24" y="24" width="32" height="32" rx="4" ry="4" fill="#ccffcc" opacity="0.95"/>
  
  <!-- Minus sign on back square (Code-Review -1) -->
  <rect x="14" y="22" width="14" height="4" rx="1" fill="#cc0000"/>
  
  <!-- Plus sign on front square (Code-Review +2) -->
  <rect x="34" y="38" width="14" height="4" rx="1" fill="#008800"/>
  <rect x="39" y="33" width="4" height="14" rx="1" fill="#008800"/>
</svg>
